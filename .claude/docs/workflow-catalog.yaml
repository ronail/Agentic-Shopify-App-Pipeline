# Workflow Catalog
# Used by /help to determine where a user is and what comes next.
#
# Artifact checks:
#   glob: file glob pattern — complete if >=1 file matches (or min_count)
#   pattern: text pattern that must appear in the file (checked after glob)
#   min_count: minimum matching files required (default: 1)
#   note: human-readable fallback when completion can't be auto-detected
#
# required: true  -> blocks progression to next phase (shown as REQUIRED)
# required: false -> optional enhancement (shown as OPTIONAL)
# repeatable: true -> runs multiple times (one per app, story, etc.)
#
# Phase gates (/gate-check): verdicts are ADVISORY — they guide the decision
# but never hard-block advancement. The user always decides whether to proceed.
#
# Every `command: /<skill>` and every step `id` below is a directory name that
# exists under .claude/skills/ (the 66-skill canonical set).
# Pipeline stage ladder: research -> architecture -> prototype -> scope ->
# build -> test -> release -> update. Gates: gate-1-research,
# gate-2-prototype, gate-3-scope, gate-4-release, gate-5-update.

phases:

  intake:
    label: "Request"
    description: "Capture and shape what is being built, then route to research"
    next_phase: research
    steps:
      - id: start
        name: "Pipeline Dashboard"
        command: /start
        required: true
        artifact:
          glob: "docs/registry/apps.json"
        description: "Read the master request, every app's status, and the pipeline stage; route to the next skill. Supports /start claude|codex|hermes for model routing."

      - id: update-request
        name: "Update Request"
        command: /update-request
        required: false
        description: "Amend request.md without losing prior intent (history appended to request-history.md)."

      - id: mmmvp-proposals
        name: "M.V.P. Proposals"
        command: /mmmvp-proposals
        required: false
        description: "Propose minimal-market-viable slices for the current request."

      - id: quick-design
        name: "Quick Design"
        command: /quick-design
        required: false
        description: "Lightweight spec for a small change, tuning, or tweak."

      - id: design-review
        name: "Design Review"
        command: /design-review
        required: false
        description: "Review a design spec for completeness, Polaris/accessibility, and implementability."

  research:
    label: "Research"
    description: "Original and competitor-killer research; UX grounding"
    next_phase: architecture
    steps:
      - id: research
        name: "Original / Competitor Research"
        command: /research
        required: true
        description: "Original vs Competitor-Killer research, consuming current request.md."

      - id: update-research
        name: "Update Research"
        command: /update-research
        required: false
        description: "Refresh market/competitor research inputs."

      - id: ux-design
        name: "UX Specs"
        command: /ux-design
        required: true
        repeatable: true
        artifact:
          glob: "apps/*/design/ux/*.md"
          min_count: 3
        description: "Author per-screen admin (Polaris) UX specs; WCAG 2.1 AA."

      - id: ux-review
        name: "UX Review"
        command: /ux-review
        required: true
        description: "Validate UX specs against Polaris, App Bridge, and accessibility tier."

      - id: gate-1-research
        name: "Gate 1 (Research)"
        command: /gate-check
        required: true
        description: "Verify gate-1-research is approved in apps/<app>/approvals.json."

  architecture:
    label: "Architecture"
    description: "Architectural decisions, control manifest, and requirements registry"
    next_phase: prototype
    steps:
      - id: create-architecture
        name: "Architecture Document"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/apps/*/*.md"
        description: "Per-app architecture doc under docs/architecture/apps/<app>/."

      - id: architecture-decision
        name: "Architecture Decisions (ADRs)"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "docs/architecture/apps/*/adr-*.md"
          min_count: 3
          pattern: "Accepted"
        description: "Document key decisions as ADRs (Shopify API Surface + App Requirements Addressed)."

      - id: architecture-review
        name: "Architecture Review"
        command: /architecture-review
        required: true
        description: "Validate ADRs, requirements.yaml, and control-manifest for Shopify conflicts."

      - id: create-control-manifest
        name: "Control Manifest"
        command: /create-control-manifest
        required: true
        artifact:
          glob: "docs/architecture/apps/*/control-manifest.md"
        description: "Flat Required/Forbidden/Guardrails sheet per layer (admin UI, app server, webhooks, theme ext, checkout ext, data)."

  prototype:
    label: "Prototype"
    description: "Throwaway prototypes to de-risk a feature"
    next_phase: scope
    steps:
      - id: build-prototype
        name: "Build Prototype"
        command: /build-prototype
        required: false
        repeatable: true
        artifact:
          note: "Check apps/<app>/prototype/ for the throwaway merchant-facing prototype."
        description: "Build a throwaway prototype under apps/<app>/prototype/."

      - id: prototype-review
        name: "Prototype Review"
        command: /prototype-review
        required: false
        description: "Review a prototype against the request before committing to a build."

      - id: prototype
        name: "Prototype Scaffold"
        command: /prototype
        required: false
        description: "Scaffold/replace a throwaway prototype under apps/<app>/prototype/."

      - id: gate-2-prototype
        name: "Gate 2 (Prototype)"
        command: /gate-check
        required: true
        description: "Verify gate-2-prototype is approved in apps/<app>/approvals.json."

  scope:
    label: "Scope & Plan"
    description: "Turn architecture + prototypes into epics and a sprint-ready backlog"
    next_phase: build
    steps:
      - id: scope-check
        name: "Scope Check"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          note: "Run when stories are added mid-sprint, or before sprint retrospectives"
        description: "Detect scope creep by comparing to request.md."

      - id: create-epics
        name: "Create Epics"
        command: /create-epics
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "Translate ADRs + requirements into epics (one per architectural module)."

      - id: create-stories
        name: "Create Stories"
        command: /create-stories
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/**/*.md"
          min_count: 2
        description: "Break each epic into implementable story files."

      - id: sprint-plan
        name: "Sprint Plan"
        command: /sprint-plan
        required: true
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          min_count: 1
        description: "Plan the current sprint with prioritized, ready stories."

      - id: estimate
        name: "Estimate"
        command: /estimate
        required: true
        description: "Size stories (story points) from production/epics/."

      - id: story-readiness
        name: "Story Readiness"
        command: /story-readiness
        required: false
        description: "Validate a story is implementation-ready before a developer picks it up."

      - id: gate-3-scope
        name: "Gate 3 (Scope)"
        command: /gate-check
        required: true
        description: "Verify gate-3-scope is approved in apps/<app>/approvals.json."

  build:
    label: "Build"
    description: "Implement stories with review and done gates"
    next_phase: test
    steps:
      - id: dev-story
        name: "Implement Story"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "Check src/ and production/epics/**/*.md for In Progress stories."
        description: "Pick the next ready story and implement it; route to the right programmer agent."

      - id: code-review
        name: "Code Review"
        command: /code-review
        required: false
        repeatable: true
        description: "Architectural code review after each story, before story-done."

      - id: story-done
        name: "Story Done"
        command: /story-done
        required: true
        repeatable: true
        description: "Verify all acceptance criteria and close the story."

      - id: qa-plan
        name: "QA Plan"
        command: /qa-plan
        required: false
        repeatable: true
        description: "Generate a QA plan per epic or sprint; feeds /smoke-check and /regression-suite."

  test:
    label: "Test"
    description: "Frameworks, fixtures, and verification"
    next_phase: store
    steps:
      - id: test-setup
        name: "Test Framework Setup"
        command: /test-setup
        required: false
        description: "Scaffold Vitest once before the first sprint (tests live beside source in apps/<app>/)."

      - id: test-helpers
        name: "Test Helpers"
        command: /test-helpers
        required: false
        description: "Generate shared test fixtures for GraphQL/webhook scenarios."

      - id: smoke-check
        name: "Smoke Check"
        command: /smoke-check
        required: false
        repeatable: true
        description: "Post-change smoke on the test store (critical merchant flows)."

      - id: regression-suite
        name: "Regression Suite"
        command: /regression-suite
        required: false
        repeatable: true
        description: "Run regression suites across apps (Vitest, recorded fixtures)."

      - id: soak-test
        name: "Soak Test"
        command: /soak-test
        required: false
        description: "Extended stability test under webhook load + GraphQL rate limits."

      - id: perf-profile
        name: "Performance Profile"
        command: /perf-profile
        required: false
        description: "Profile admin route p75/LCP, bundle size, GraphQL cost."

      - id: security-audit
        name: "Security Audit"
        command: /security-audit
        required: false
        description: "OAuth/session/HMAC/PII/scope review with compliance webhooks."

  store:
    label: "Store"
    description: "Provision and deploy to a test store"
    next_phase: release
    steps:
      - id: scaffold
        name: "Scaffold App"
        command: /scaffold
        required: true
        artifact:
          glob: "apps/*/"
          min_count: 1
        description: "Create apps/<app-name>/ skeleton; register in docs/registry/apps.json."

      - id: create-test-store
        name: "Create Test Store"
        command: /create-test-store
        required: false
        description: "Provision a dev/test store for an app."

      - id: deploy-to-test-store
        name: "Deploy to Test Store"
        command: /deploy-to-test-store
        required: false
        repeatable: true
        description: "Deploy a build to the test store for validation."

  release:
    label: "Release"
    description: "Submission readiness and ship"
    next_phase: operate
    steps:
      - id: release-checklist
        name: "Release Checklist"
        command: /release-checklist
        required: true
        description: "App Store submission readiness (scopes, billing, compliance webhooks, privacy)."

      - id: app-store-checklist
        name: "App Store Checklist"
        command: /app-store-checklist
        required: true
        description: "Final App Store submission gate."

      - id: release
        name: "Release"
        command: /release
        required: true
        repeatable: true
        description: "Cut a versioned release for App Store submission."

      - id: launch-checklist
        name: "Launch Checklist"
        command: /launch-checklist
        required: true
        description: "Post-approval go-live (deploy, live billing, monitoring, merchant comms, rollback)."

      - id: changelog
        name: "Changelog"
        command: /changelog
        required: false
        description: "Internal changelog from commits, sprints, and design docs."

      - id: patch-notes
        name: "Patch Notes"
        command: /patch-notes
        required: false
        description: "Merchant-facing release notes."

      - id: gate-4-release
        name: "Gate 4 (Release)"
        command: /gate-check
        required: true
        description: "Verify gate-4-release is approved in apps/<app>/approvals.json."

  operate:
    label: "Operate"
    description: "Run, iterate, and improve the shipped app"
    next_phase: null
    steps:
      - id: hotfix
        name: "Hotfix"
        command: /hotfix
        required: false
        repeatable: true
        description: "Production incident hotfix (branch, minimal fix, test, redeploy)."

      - id: tech-debt
        name: "Tech Debt"
        command: /tech-debt
        required: false
        description: "Maintain and prioritize a tech-debt log."

      - id: reverse-document
        name: "Reverse Document"
        command: /reverse-document
        required: false
        description: "Document existing app code into docs/architecture/apps/<app>/."

      - id: localize
        name: "Localize"
        command: /localize
        required: false
        description: "Merchant-facing localization (Markets, translations, locale formatting)."

      - id: milestone-review
        name: "Milestone Review"
        command: /milestone-review
        required: false
        repeatable: true
        description: "Review a milestone for an app."

      - id: consistency-check
        name: "Consistency Check"
        command: /consistency-check
        required: false
        description: "Cross-app and cross-doc consistency scan."

      - id: propose-updates
        name: "Propose Updates"
        command: /propose-updates
        required: false
        description: "Propose framework/skill/agent updates from observed friction."

      - id: apply-updates
        name: "Apply Updates"
        command: /apply-updates
        required: false
        description: "Apply ratified proposals to agents, skills, rules, and hooks."

      - id: gate-5-update
        name: "Gate 5 (Update)"
        command: /gate-check
        required: true
        description: "Verify gate-5-update is approved in apps/<app>/approvals.json."

  navigate:
    label: "Navigate"
    description: "Cross-cutting discovery, status, and workflow utilities"
    next_phase: null
    steps:
      - id: help
        name: "Help"
        command: /help
        required: false
        description: "Context-aware guidance: read the current stage and surface the next required step."

      - id: project-stage-detect
        name: "Project Stage Detect"
        command: /project-stage-detect
        required: false
        description: "Detect each app's pipeline stage from docs/registry/apps.json."

      - id: kanban-status
        name: "Kanban Status"
        command: /kanban-status
        required: false
        description: "Render pipeline/kanban state across apps."

      - id: onboard
        name: "Onboard"
        command: /onboard
        required: false
        description: "Onboard a developer or merchant to the project."

      - id: adopt
        name: "Adopt (Brownfield)"
        command: /adopt
        required: false
        description: "Audit an existing app's internal structure and produce a migration plan."

      - id: bug-report
        name: "Bug Report"
        command: /bug-report
        required: false
        repeatable: true
        description: "Log and structure a bug."

      - id: bug-triage
        name: "Bug Triage"
        command: /bug-triage
        required: false
        repeatable: true
        description: "Prioritize the open bug backlog."

      - id: retrospective
        name: "Retrospective"
        command: /retrospective
        required: false
        description: "Post-sprint review to capture what worked and what to change."

      - id: sprint-status
        name: "Sprint Status"
        command: /sprint-status
        required: false
        description: "30-line snapshot of sprint progress."
