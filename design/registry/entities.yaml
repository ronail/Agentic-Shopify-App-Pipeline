# Design Entity Registry
#
# PURPOSE: Single source of truth for named design and platform facts that
# appear in more than one document. Skills check this before writing new
# content so cross-document drift is caught at authoring time.
#
# RULES:
#   - Register a fact only when a second document must agree with it.
#     A value used in one screen spec stays in that spec.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment naming the document that changed it.
#   - source: is the authoritative document — the one that "owns" this fact.
#     Documents that repeat it list themselves in referenced_by.
#   - API facts must exist in the pinned snapshot: docs/shopify-api-reference/<version>/
#
# WRITTEN BY: /ux-design (when a shared pattern or constant is introduced)
#             /quick-design (when a change alters a shared value)
#             /consistency-check (when resolving conflicts)
# READ BY:    /ux-design, /quick-design (before authoring, to avoid contradicting
#               an existing fact)
#             /consistency-check (primary input — grep-first, docs-second)
#             /architecture-review (API surface and data-contract validation)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entry names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   One entry:              Grep pattern="  - name: bundle" path="design/registry/entities.yaml"
#   What one doc owns:      Grep pattern="source: apps/<app>/design/ux/editor.md"
#   Docs that repeat it:    Grep pattern="referenced_by.*editor"
#   All limits:             Grep pattern="^constants:" -A 40
#   Deprecated entries:     Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent two-space indentation is required for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], added, revised
#
# USED BY THE INIT SCRIPT: scripts/init-template.sh resets this file to the
# empty shape below in a generated repo. Keep the section keys stable.

version: 1
last_updated: ""

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named domain objects the app reasons about — a bundle, a tag rule, a
# discount, a merchant segment. Register one when two or more documents
# describe its identity, lifecycle or fields.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any property another document might state
#   (identifiers, lifecycle states, owning API object, metafield namespace).

entities: []

# Example:
#
# entities:
#   - name: bundle
#     status: active              # active | deprecated
#     source: apps/discount-bundles/design/ux/bundle-editor.md
#     referenced_by:
#       - apps/discount-bundles/design/ux/bundle-editor.md
#       - docs/architecture/apps/discount-bundles/ADR-0001-bundle-cart-transform.md
#     identifiers:
#       - shopify_product_id
#       - metafield: namespace=custom, key=bundle_components
#     lifecycle:
#       - draft
#       - active
#       - archived
#     added: 2026-10-30
#     revised: ""

# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named API surfaces, admin components or shared UI patterns that more than one
# document names — a Polaris component, an App Bridge context, a webhook topic,
# an access scope.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: surface (admin-ui | app-server | webhooks | extension),
#   scope, topic, component, api_version.

items: []

# Example:
#
# items:
#   - name: orders/updated
#     status: active
#     source: docs/architecture/apps/order-tags/ADR-0002-order-tag-webhooks.md
#     referenced_by:
#       - docs/architecture/apps/order-tags/ADR-0002-order-tag-webhooks.md
#       - apps/order-tags/shopify.app.toml
#     surface: webhooks
#     topic: orders/updated
#     api_version: "2026-10"
#     added: 2026-10-30
#     revised: ""

# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations whose output another document consumes — discount
# application, proration, quantity expansion, rounding.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression, notes

formulas: []

# Example:
#
# formulas:
#   - name: bundle_unit_price
#     status: active
#     source: apps/discount-bundles/design/quick-specs/fixed-price-bundles.md
#     referenced_by:
#       - apps/discount-bundles/design/ux/bundle-editor.md
#       - docs/architecture/apps/discount-bundles/control-manifest.md
#     variables:
#       - component_price_minor_units
#       - component_quantity
#       - discount_percent
#     output_range: [0, 100000000]
#     expression: "sum(component_price_minor_units * component_quantity) * (100 - discount_percent) / 100"
#     notes: "All money in integer minor units. Rounding is half-up at the line level."
#     added: 2026-10-30
#     revised: ""

# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named limits or fixed values that more than one document must agree on —
# platform limits, scope ceilings, copy strings that must match exactly.
#
# Required fields: name, status, source, referenced_by, value, added
# Optional: unit, notes

constants: []

# Example:
#
# constants:
#   - name: max_components_per_bundle
#     status: active
#     source: apps/discount-bundles/design/quick-specs/fixed-price-bundles.md
#     referenced_by:
#       - apps/discount-bundles/design/ux/bundle-editor.md
#     value: 100
#     unit: components
#     notes: "Shopify cart transform input limit; exceeding it fails the function run."
#     added: 2026-10-30
#     revised: ""
